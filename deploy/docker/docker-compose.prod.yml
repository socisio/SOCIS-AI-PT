# SOCIS-AI-PT — Production (On-Premises) Compose
# ─────────────────────────────────────────────────────────────────────────────
# Hardened production setup built from local source.
# All secrets MUST be set in .env — no fallback defaults.
# Platform data persists under ${SOCIS_HOME:-/opt/socis}/.
#
# Quick start (CPU):
#   docker compose -f docker-compose.onprem.yml up -d
#
# With NVIDIA GPU (Ollama):
#   docker compose -f docker-compose.onprem.yml -f docker-compose.gpu.yml up -d
#
# Rebuild after code changes:
#   bash deploy/scripts/install.sh --prod --rebuild
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─── PostgreSQL 16 ────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: socis_postgres
    restart: always
    security_opt:
      - no-new-privileges:true
    # perf #2/#5: raise max_connections (default 100 is too low for multi-worker
    # pools) and apply basic server tuning. Adjust shared_buffers/effective_cache
    # _size to ~25% / ~60% of the container memory limit.
    command:
      - "postgres"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE:-1536MB}"
      - "-c"
      - "work_mem=${POSTGRES_WORK_MEM:-16MB}"
      - "-c"
      - "maintenance_work_mem=128MB"
    environment:
      POSTGRES_DB: socis_ai_pt
      POSTGRES_USER: socis_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${SOCIS_HOME:-/opt/socis}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socis_admin -d socis_ai_pt"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Resource limits (perf #1) — cap blast radius; override in .env.
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPUS:-2}"
          memory: ${POSTGRES_MEM:-2g}
    networks: [socis-net]
    logging:
      driver: "json-file"
      options: {max-size: "50m", max-file: "5"}

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: socis_redis
    restart: always
    security_opt:
      - no-new-privileges:true
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory ${REDIS_MAXMEMORY:-1gb} --maxmemory-policy noeviction --appendonly yes
    volumes:
      - ${SOCIS_HOME:-/opt/socis}/data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Resource limits (perf #1) — cap blast radius; override in .env.
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPUS:-1}"
          memory: ${REDIS_MEM:-768m}
    networks: [socis-net]
    logging:
      driver: "json-file"
      options: {max-size: "50m", max-file: "5"}

  # ─── MinIO Object Storage ─────────────────────────────────────────────────
  # Internal only — not exposed publicly; backend accesses via docker network.
  minio:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    container_name: socis_minio
    restart: always
    security_opt:
      - no-new-privileges:true
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - ${SOCIS_HOME:-/opt/socis}/data/minio:/data
    # Resource limits (perf #1) — cap blast radius; override in .env.
    deploy:
      resources:
        limits:
          cpus: "${MINIO_CPUS:-1}"
          memory: ${MINIO_MEM:-1g}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [socis-net]
    logging:
      driver: "json-file"
      options: {max-size: "50m", max-file: "5"}

  # ─── LLM providers ────────────────────────────────────────────────────────
  # Bundled local Ollama container REMOVED. Set OLLAMA_REMOTE_URL to an external
  # Ollama server (default LLM), and/or configure the hosted API providers
  # (OpenAI/Anthropic/OpenRouter/Grok/Mistral) in .env.

  # ─── Backend API (FastAPI) ────────────────────────────────────────────────
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        APP_UID: "10001"
    container_name: socis_backend
    restart: always
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ALLOW_OPEN_REGISTRATION: ${ALLOW_OPEN_REGISTRATION:-false}
      DEFAULT_USER_ROLE: ${DEFAULT_USER_ROLE:-viewer}
      SOCIS_AGENT_ALLOW_OFFENSIVE: ${SOCIS_AGENT_ALLOW_OFFENSIVE:-false}
      MCP_ALLOW_STDIO_SERVERS: ${MCP_ALLOW_STDIO_SERVERS:-false}
      MAX_CONCURRENT_CHAT_SESSIONS: ${MAX_CONCURRENT_CHAT_SESSIONS:-20}
      REPORT_RETENTION_DAYS: ${REPORT_RETENTION_DAYS:-90}
      DOMAIN: ${DOMAIN:-}
      REDIS_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      DATABASE_URL: postgresql+asyncpg://socis_admin:${DB_PASSWORD}@postgres:5432/socis_ai_pt
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # External Ollama server is the default LLM (no bundled container).
      OLLAMA_REMOTE_URL: ${OLLAMA_REMOTE_URL:-}
      OLLAMA_REMOTE_MODEL: ${OLLAMA_REMOTE_MODEL:-socis-pentest}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: socis-reports
      MINIO_SECURE: "false"
      DEPLOYMENT_MODE: production
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
      FRONTEND_URL: https://${DOMAIN}
      DEBUG: "false"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SECURE_COOKIES: "true"
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN must be set in .env (openssl rand -hex 32)}
      ALLOWED_ORIGINS: '["https://${DOMAIN}"]'
      RATE_LIMIT_ENABLED: "true"
      # OAuth (optional)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      # External LLM APIs (optional)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PLUGINS_DIR: /app/plugins
    volumes:
      - ${SOCIS_HOME:-/opt/socis}/reports:/app/reports
      - ${SOCIS_HOME:-/opt/socis}/data/projects:/projects
      - ${SOCIS_HOME:-/opt/socis}/data/plugins:/app/plugins
      - ${SOCIS_HOME:-/opt/socis}/logs/backend:/app/logs
    # Resource limits (perf #1) — cap blast radius; override in .env.
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_CPUS:-2}"
          memory: ${BACKEND_MEM:-2g}
    networks: [socis-net]
    logging:
      driver: "json-file"
      options: {max-size: "100m", max-file: "10"}

  # ─── ARQ Worker (Background Scan Tasks) ──────────────────────────────────
  worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        APP_UID: "10001"
    container_name: socis_worker
    restart: always
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "arq", "app.tasks.scan_worker.WorkerSettings"]
    environment:
      DEPLOYMENT_MODE: production
      DEBUG: "false"
      SECURE_COOKIES: "true"
      RATE_LIMIT_ENABLED: "true"
      FRONTEND_URL: https://${DOMAIN}
      ALLOWED_ORIGINS: '["https://${DOMAIN}"]'
      DOMAIN: ${DOMAIN:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ARQ_MAX_JOBS: ${ARQ_MAX_JOBS:-10}
      ARQ_JOB_TIMEOUT: ${ARQ_JOB_TIMEOUT:-3600}
      MCP_ALLOW_PRIVATE_TARGETS: ${MCP_ALLOW_PRIVATE_TARGETS:-false}
      MCP_ALLOWED_PRIVATE_NETS: ${MCP_ALLOWED_PRIVATE_NETS:-}
      SOCIS_AGENT_ALLOW_OFFENSIVE: ${SOCIS_AGENT_ALLOW_OFFENSIVE:-false}
      REDIS_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      DATABASE_URL: postgresql+asyncpg://socis_admin:${DB_PASSWORD}@postgres:5432/socis_ai_pt
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # External Ollama server is the default LLM (no bundled container).
      OLLAMA_REMOTE_URL: ${OLLAMA_REMOTE_URL:-}
      OLLAMA_REMOTE_MODEL: ${OLLAMA_REMOTE_MODEL:-socis-pentest}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: socis-reports
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN must be set in .env (openssl rand -hex 32)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PLUGINS_DIR: /app/plugins
    volumes:
      - ${SOCIS_HOME:-/opt/socis}/reports:/app/reports
      - ${SOCIS_HOME:-/opt/socis}/data/projects:/projects
      - ${SOCIS_HOME:-/opt/socis}/data/plugins:/app/plugins
    # Resource limits (perf #1) — cap blast radius; override in .env.
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPUS:-2}"
          memory: ${WORKER_MEM:-2g}
    networks: [socis-net]
    logging:
      driver: "json-file"
      options: {max-size: "100m", max-file: "10"}

  # ─── Frontend (Next.js — production build) ───────────────────────────────
  # Served behind nginx — no port exposed directly.
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_API_PROXY_URL: "http://backend:8000"
        # false (default): type errors do not block the production build. true: enforce them.
        NEXT_STRICT_BUILD: ${NEXT_STRICT_BUILD:-false}
    container_name: socis_frontend
    restart: always
    security_opt:
      - no-new-privileges:true
    depends_on: [backend]
    environment:
      NEXT_API_PROXY_URL: http://backend:8000
      NODE_ENV: production
      # Keep Node's heap below the container limit (an OOM-kill restarts the container and drops in-flight requests).
      NODE_OPTIONS: --max-old-space-size=${FRONTEND_HEAP_MB:-1536}
      NEXT_STRICT_MODE: ${NEXT_STRICT_MODE:-false}
    # Resource limits (perf #1) — cap blast radius; override in .env.
    deploy:
      resources:
        limits:
          cpus: "${FRONTEND_CPUS:-2}"
          memory: ${FRONTEND_MEM:-2g}
    networks: [socis-net]
    logging:
      driver: "json-file"
      options: {max-size: "50m", max-file: "5"}

  # ─── Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: socis_nginx
    restart: always
    security_opt:
      - no-new-privileges:true
    depends_on: [backend, frontend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ${SOCIS_HOME:-/opt/socis}/ssl:/etc/nginx/ssl:ro
      - ${SOCIS_HOME:-/opt/socis}/certbot-www:/var/www/certbot:ro
      - ${SOCIS_HOME:-/opt/socis}/reports:/var/www/reports:ro
    # Resource limits (perf #1) — cap blast radius; override in .env.
    deploy:
      resources:
        limits:
          cpus: "${NGINX_CPUS:-1}"
          memory: ${NGINX_MEM:-256m}
    networks: [socis-net]
    logging:
      driver: "json-file"
      options: {max-size: "50m", max-file: "5"}

  # ─── Metasploit RPC Daemon ────────────────────────────────────────────────
  # Required by the Metasploit MCP server inside mcp_all.
  # Internal only — not exposed publicly.
  metasploit_rpc:
    build:
      context: ../../mcp-servers
      dockerfile: Dockerfile.metasploit
    container_name: socis_metasploit_rpc
    restart: always
    environment:
      MSF_PASSWORD: ${MSF_PASSWORD}
      MSF_PORT: ${MSF_PORT:-55553}
      MSF_SSL: ${MSF_SSL:-false}
    volumes:
      - ${SOCIS_HOME:-/opt/socis}/data/metasploit:/root/.msf4
    # Resource limits (perf #1) — cap blast radius; override in .env.
    deploy:
      resources:
        limits:
          cpus: "${MSF_CPUS:-2}"
          memory: ${MSF_MEM:-2g}
    networks: [socis-net]
    healthcheck:
      test: ["CMD", "ps", "aux"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options: {max-size: "50m", max-file: "5"}

  # ─── All MCP Tool Servers (consolidated) ─────────────────────────────────
  # 19 Python MCP servers managed by supervisord:
  #   cve(8100)  nmap(8101)  nuclei(8102)  osint(8103)  metasploit(8104)
  #   mitre(8105)  waf(8107)  ffuf(8108)  sqlmap(8109)  ssl(8112)
  #   cisa_kev(8114)  epss(8115)  poc(8116)  nikto(8117)  masscan(8118)
  #   wpscan(8119)  jwt(8120)  gobuster(8121)  cve_lite(8122)
  # Internal only — backend accesses via docker network (no port exposure).
  mcp_all:
    build:
      context: ../../mcp-servers
      dockerfile: Dockerfile
    container_name: socis_mcp_all
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      metasploit_rpc:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ${SOCIS_HOME:-/opt/socis}/data/wordlists:/usr/share/wordlists
      - ${SOCIS_HOME:-/opt/socis}/data/cve-lite:/var/cve-lite
      - ${SOCIS_HOME:-/opt/socis}/data/projects:/projects:ro
    environment:
      MCP_ALLOW_PRIVATE_TARGETS: ${MCP_ALLOW_PRIVATE_TARGETS:-false}
      MCP_ALLOWED_PRIVATE_NETS: ${MCP_ALLOWED_PRIVATE_NETS:-}
      REDIS_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      DATABASE_URL: postgresql+asyncpg://socis_admin:${DB_PASSWORD}@postgres:5432/socis_ai_pt
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BACKEND_URL: http://backend:8000
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN must be set in .env (openssl rand -hex 32)}
      MCP_MITRE_ENABLED: ${MCP_MITRE_ENABLED:-true}
      MSF_HOST: ${MSF_HOST:-metasploit_rpc}
      MSF_PORT: ${MSF_PORT:-55553}
      MSF_PASSWORD: ${MSF_PASSWORD}
      MSF_SSL: ${MSF_SSL:-false}
      PAYLOAD_SAVE_DIR: ${PAYLOAD_SAVE_DIR:-}
      WORDLIST_DIR: /usr/share/wordlists
      CVE_LITE_ALLOWED_ROOTS: /projects:/tmp:/workspace:/app/projects:/var/cve-lite
      WPSCAN_API_TOKEN: ${WPSCAN_API_TOKEN:-}
    # Resource limits (perf #1) — cap blast radius; override in .env.
    deploy:
      resources:
        limits:
          cpus: "${MCP_CPUS:-4}"
          memory: ${MCP_MEM:-4g}
    networks: [socis-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options: {max-size: "100m", max-file: "10"}

  # ─── Monitoring stack (observability #9) — built in, starts automatically ──
  # Grafana served at /monitoring/ through nginx, themed to match SOCIS.
  # Prometheus scrapes the backend /metrics + node/postgres/redis exporters.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: socis_prometheus
    restart: always
    security_opt:
      - no-new-privileges:true
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=${PROM_RETENTION:-15d}"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${SOCIS_HOME:-/opt/socis}/data/prometheus:/prometheus
    deploy:
      resources:
        limits:
          cpus: "${PROM_CPUS:-1}"
          memory: ${PROM_MEM:-1g}
    networks: [socis-net]
    logging:
      driver: "json-file"
      options: {max-size: "50m", max-file: "5"}

  grafana:
    image: grafana/grafana:11.2.0
    container_name: socis_grafana
    restart: always
    security_opt:
      - no-new-privileges:true
    depends_on: [prometheus]
    environment:
      GF_SERVER_DOMAIN: "${DOMAIN}"
      GF_SERVER_ROOT_URL: "https://${DOMAIN}/monitoring/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ../monitoring/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${SOCIS_HOME:-/opt/socis}/data/grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    deploy:
      resources:
        limits:
          cpus: "${GRAFANA_CPUS:-1}"
          memory: ${GRAFANA_MEM:-512m}
    networks: [socis-net]
    logging:
      driver: "json-file"
      options: {max-size: "50m", max-file: "5"}

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: socis_node_exporter
    restart: always
    security_opt:
      - no-new-privileges:true
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro,rslave
    deploy:
      resources:
        limits: { cpus: "0.3", memory: 128m }
    networks: [socis-net]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: socis_postgres_exporter
    restart: always
    security_opt:
      - no-new-privileges:true
    depends_on: [postgres]
    environment:
      DATA_SOURCE_NAME: "postgresql://socis_admin:${DB_PASSWORD}@postgres:5432/socis_ai_pt?sslmode=disable"
    deploy:
      resources:
        limits: { cpus: "0.3", memory: 128m }
    networks: [socis-net]

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: socis_redis_exporter
    restart: always
    security_opt:
      - no-new-privileges:true
    depends_on: [redis]
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits: { cpus: "0.3", memory: 128m }
    networks: [socis-net]

networks:
  socis-net:
    driver: bridge

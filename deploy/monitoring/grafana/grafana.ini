[server]
# Served behind the platform nginx under /monitoring/ (see nginx.conf).
# HOST-AGNOSTIC: domain is left empty so Grafana derives the public host from
# the Host header nginx forwards (proxy_set_header Host $http_host). This works
# on any deployment IP/hostname with NO per-deployment config. The env vars in
# compose (GF_SERVER_*) take precedence over this file.
domain =
root_url = %(protocol)s://%(domain)s/monitoring/
serve_from_sub_path = true

[security]
# Allow embedding so the Monitoring tab could iframe it if desired, and set a
# sensible default admin. Password is injected via env (GF_SECURITY_ADMIN_*).
allow_embedding = true
cookie_samesite = lax

[users]
default_theme = dark

[auth.anonymous]
# Off by default — operators log in. Set GF_AUTH_ANONYMOUS_ENABLED=true in .env
# to allow read-only viewing without a Grafana login.
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false

[dashboards]
# The SOCIS Overview is the landing dashboard.
default_home_dashboard_path = /var/lib/grafana/dashboards/00-overview.json

[panels]
disable_sanitize_html = false

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Pin the UID so the provisioned dashboards (which reference
    # "uid": "prometheus") resolve to this datasource. Without this, Grafana
    # assigns a random UID and every panel shows "No data".
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

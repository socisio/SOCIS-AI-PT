global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Backend app metrics (custom SOCIS metrics + FastAPI instrumentation)
  - job_name: socis-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  # Host / container resource metrics
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # PostgreSQL metrics
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Redis metrics
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

# ═══════════════════════════════════════════════════════════════════════════
# SOCIS-AI-PT — PRODUCTION nginx (TLS terminating)
# Used only by docker-compose.prod.yml. Dev keeps using nginx.conf (HTTP).
#
# Certificates are read from /etc/nginx/ssl/{fullchain,privkey}.pem, which the
# installer populates (Let's Encrypt, customer-provided, or self-signed) — see
# deploy/scripts/lib/tls.sh. Port 80 only serves the ACME challenge, a health
# probe, and a redirect to HTTPS.
# ═══════════════════════════════════════════════════════════════════════════

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # WebSocket upgrade mapping (frontend + backend /ws).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    gzip                on;
    gzip_types          text/plain text/css application/json application/javascript text/xml;
    client_max_body_size 10M;

    # Rate limiting (same budgets as dev). 429 instead of the default 503.
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_status 429;

    # Re-resolve backend/frontend through Docker's DNS instead of pinning their IPs
    # at startup. A static `upstream` caches the IP forever, so recreating a
    # container (every upgrade/--rebuild) gave a permanent 502 until nginx was
    # restarted. Using variables in proxy_pass makes nginx look the name up again
    # (valid=10s) and also lets nginx start before the app containers exist.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ─── TLS hardening ───────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ─── :80 — ACME challenge, health probe, redirect to HTTPS ───
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Let's Encrypt HTTP-01 validation + renewals (webroot mode).
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        # Plain-HTTP liveness probe (load balancers / monitoring).
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── :443 — the platform ─────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        set $backend_up  http://backend:8000;
        set $frontend_up http://frontend:3000;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Security headers. NOTE: nginx does not inherit add_header into a
        # location that defines its own, so /monitoring/ repeats them below.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Strict CSP: no 'unsafe-eval' (the prod frontend is a production Next.js
        # build). 'unsafe-inline' remains for Next's inline hydration bootstrap.
        # Google Fonts hosts are allowed because the UI loads Inter/JetBrains Mono.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # ─── API ────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass $backend_up;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 60s;
        }

        # ─── Auth (stricter rate limit) ─────────────────────────
        location /api/v1/auth/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass $backend_up;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── WebSocket ──────────────────────────────────────────
        location /ws/ {
            proxy_pass $backend_up;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ─── Report downloads (X-Accel-Redirect only) ───────────
        location /reports/ {
            alias /var/www/reports/;
            internal;
        }

        # ─── Grafana monitoring (sidebar "Monitoring" tab) ──────
        location /monitoring/ {
            # Variable upstream + Docker DNS so nginx still starts if Grafana
            # is down/absent (returns 502 for this path only).
            set $grafana_upstream grafana;
            proxy_pass http://$grafana_upstream:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;

            # Repeat security headers (add_header is not inherited here) and drop
            # Grafana's own copies to avoid duplicates. Grafana's UI needs
            # 'unsafe-eval' (panel/plugin runtime), so this location has its own CSP.
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Content-Security-Policy;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Frame-Options DENY always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }

        # ─── Frontend ───────────────────────────────────────────
        location / {
            proxy_pass $frontend_up;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

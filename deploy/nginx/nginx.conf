# perf #8: use all cores and raise the per-worker file-descriptor limit so the
# edge can handle many concurrent dashboard XHRs / SSE streams.
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # WebSocket upgrade mapping: "upgrade" when the client requests it, else
    # "close". Required for proxying WebSockets (Next.js HMR, backend /ws).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ─── Logging ─────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ─── Performance ─────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    gzip                on;
    gzip_types          text/plain text/css application/json application/javascript text/xml;
    # Reconciled with backend REQUEST_MAX_BODY_SIZE (10MB) so nginx rejects
    # oversized bodies before they reach the app (fix L-3). Raise BOTH together
    # if large uploads (e.g. project archives) are required.
    client_max_body_size 10M;

    # ─── Rate Limiting ────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # ─── Upstream Services ────────────────────────────────────
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    # ─── TLS hardening (fix M-8) ─────────────────────────────
    # These directives apply to any TLS server block below. For production,
    # terminate TLS here: uncomment the HTTPS server template at the bottom of
    # this file, mount a real CA-issued cert, and switch the HTTP server to a
    # redirect. Generate a dev cert with deploy/nginx/ssl/generate_ssl.sh.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ─── HTTP Server ──────────────────────────────────────────
    # NOTE: For production, set DEPLOYMENT to HTTPS by enabling the server
    # block at the end of this file and changing this block's `location /`
    # to: `return 301 https://$host$request_uri;`
    server {
        listen 80;
        server_name _;

        # HSTS is emitted on HTTPS responses only (sending it over plain HTTP
        # has no effect and can lock out HTTP-only LAN setups). See HTTPS block.

        # Security headers (fix M-7). Dropped 'unsafe-eval' and the permissive
        # X-XSS-Protection; tightened connect-src. 'unsafe-inline' for scripts
        # is retained only because Next.js injects inline hydration bootstrap;
        # move to nonce-based CSP if the app is reworked to support it.
        server_tokens off;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # NOTE: this HTTP server is the DEVELOPMENT entrypoint. Next.js dev
        # (`next dev`) requires 'unsafe-eval' for hot-reload and loads Google
        # Fonts, so the CSP here is relaxed accordingly. The production HTTPS
        # server block (below) keeps the strict CSP without 'unsafe-eval'.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ─── API Routes ───────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 60s;
        }

        # ─── Auth Routes (stricter rate limit) ───────────────
        location /api/v1/auth/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── WebSocket ────────────────────────────────────────
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ─── Report Downloads ─────────────────────────────────
        location /reports/ {
            alias /var/www/reports/;
            internal;
        }

        # ─── Frontend ────────────────────────────────────────
        # Grafana monitoring UI (observability #9). Served under /monitoring/ so
        # the sidebar "Monitoring" tab opens it on the same origin. Grafana is
        # configured with serve_from_sub_path; WebSocket upgrade is forwarded for
        # its live features. Only reachable when the monitoring profile is up.
        location /monitoring/ {
            # Use a variable + Docker's embedded DNS resolver so nginx still
            # STARTS when the monitoring profile is down (grafana absent). Without
            # this, a missing upstream at startup would crash nginx. When
            # monitoring is off, this returns 502 (expected) instead.
            resolver 127.0.0.11 valid=30s ipv6=off;
            # proxy_pass WITHOUT a trailing path/URI so nginx passes the full
            # original request path (/monitoring/...) through unchanged. Combined
            # with Grafana serve_from_sub_path=true this serves correctly; adding
            # "/monitoring/" here caused a path mismatch -> login redirect loop.
            set $grafana_upstream grafana;
            proxy_pass http://$grafana_upstream:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Forward the REAL host + proto the browser used so Grafana builds
            # redirects against it — works on ANY deployment IP/hostname with no
            # per-deployment config. Grafana reads these (GF_SERVER_ROUTER_LOGGING
            # off) via its proxy-aware root_url.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Next.js dev HMR WebSocket — must forward the Upgrade handshake, or the
        # browser logs "can't establish a connection to ws://.../_next/webpack-hmr".
        location /_next/webpack-hmr {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            # Forward WebSocket upgrades (HMR, live reload) through the frontend.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            # `next dev` compiles each page on its FIRST request. On a small CPU that can take longer than
            # nginx's 60s default, which surfaced as a 504 on /login right after a rebuild.
            proxy_connect_timeout 10s;
            proxy_read_timeout 300s;
            # Let the Next.js dev server's own Content-Type stand for assets it
            # serves (CSS/JS). The global X-Content-Type-Options: nosniff header
            # combined with a proxied text/plain response was blocking the dev
            # stylesheet; proxied upstream types are trusted here.
            proxy_hide_header X-Content-Type-Options;
        }
    }

    # ─── HTTPS Server (production template — fix M-8) ─────────
    # Enable for production TLS termination:
    #  1. Place cert/key at /etc/nginx/ssl/ (see ssl/generate_ssl.sh for dev,
    #     use a real CA cert for production).
    #  2. Uncomment this block.
    #  3. Change the HTTP server's `location /` to redirect:
    #     return 301 https://$host$request_uri;
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name _;
    #
    #     ssl_certificate     /etc/nginx/ssl/socis.crt;
    #     ssl_certificate_key /etc/nginx/ssl/socis.key;
    #
    #     # HSTS — one year, include subdomains (fix M-8). Only safe on HTTPS.
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     server_tokens off;
    #     add_header X-Frame-Options DENY always;
    #     add_header X-Content-Type-Options nosniff always;
    #     add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    #     add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    #
    #     client_max_body_size 10M;
    #
    #     location /health { access_log off; return 200 "healthy\n"; add_header Content-Type text/plain; }
    #     location /api/v1/auth/ { limit_req zone=auth burst=20 nodelay; proxy_pass http://backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    #     location /api/ { limit_req zone=api burst=60 nodelay; proxy_pass http://backend; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 600s; }
    #     location /ws/ { proxy_pass http://backend; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "Upgrade"; proxy_set_header Host $host; proxy_read_timeout 3600s; }
